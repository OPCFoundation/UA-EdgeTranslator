name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: 1
  DOTNET_NOLOGO: true

jobs:
  line-endings:
    name: Line endings (LF)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Fail on CRLF in tracked text files
        shell: bash
        run: |
          # .gitattributes pins all text to eol=lf except *.bat / *.cmd.
          # Fail if any other tracked file has a CR byte in its blob.
          offenders="$(git grep --cached -Il $'\r' -- ':(exclude)*.bat' ':(exclude)*.cmd' || true)"
          if [ -n "$offenders" ]; then
            echo "::error::Tracked text files contain CRLF; run 'git add --renormalize .' and commit."
            echo "$offenders"
            exit 1
          fi
          echo "OK: no CRLF in tracked text files."

  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        # Linux validates net10.0; Windows is required for the
        # net10.0-windows / net10.0-windows10.0.26100.0 TFMs and the
        # OPCDA driver.
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UAEdgeTranslator.sln

      - name: Build
        run: dotnet build UAEdgeTranslator.sln -c Release --no-restore

      - name: Test
        run: dotnet test UAEdgeTranslator.sln -c Release --no-build --no-restore --logger "trx;LogFileName=test-results.trx" --results-directory TestResults --collect:"XPlat Code Coverage" --settings coverage.runsettings

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: '**/TestResults/*.trx'
          if-no-files-found: warn

      # Coverage is produced by the Linux leg only. Both matrix legs run the
      # same test project, so generating from each would be redundant work.
      - name: Generate coverage report
        if: matrix.os == 'ubuntu-latest'
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:'**/TestResults/**/coverage.cobertura.xml' \
            -targetdir:CoverageReport \
            -reporttypes:'Html;TextSummary;MarkdownSummaryGithub'

      - name: Publish coverage summary to the job page
        if: matrix.os == 'ubuntu-latest'
        run: cat CoverageReport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: |
            **/TestResults/**/coverage.cobertura.xml
            CoverageReport
          if-no-files-found: warn

  # Publishes a self-hosted coverage badge. No third-party service and no
  # secrets: the SVG is generated by ReportGenerator and pushed to an orphan
  # 'badges' branch, which the README links to. Keeping it off main means the
  # badge refresh never adds noise to the main branch history.
  coverage-badge:
    name: Coverage badge
    runs-on: ubuntu-latest
    needs: build
    # Only publish for the real branch state; PRs from forks cannot push and
    # would fail, so restrict this to pushes on main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore UAEdgeTranslator.sln

      - name: Build
        run: dotnet build UAEdgeTranslator.sln -c Release --no-restore

      - name: Test with coverage
        run: dotnet test UAEdgeTranslator.sln -c Release --no-build --no-restore --collect:"XPlat Code Coverage" --settings coverage.runsettings --results-directory TestResults

      - name: Generate badge
        run: |
          dotnet tool install -g dotnet-reportgenerator-globaltool
          export PATH="$PATH:$HOME/.dotnet/tools"
          reportgenerator \
            -reports:'**/TestResults/**/coverage.cobertura.xml' \
            -targetdir:BadgeOut \
            -reporttypes:'Badges;TextSummary'

          # ReportGenerator's badge hard-codes the label "Coverage", which does
          # not say what is actually measured. Emit our own SVG instead, with
          # the label the README advertises. Widths are computed from the text
          # length so the two halves always fit their content.
          pct="$(grep -m1 'Line coverage:' BadgeOut/Summary.txt | sed 's/.*: *//' | tr -d ' ')"
          label='Coverage (UA Edge Translator)'

          # ~62 tenths-of-a-px per character at font-size 11, plus padding.
          label_w=$(( (${#label} * 62) / 10 + 12 ))
          value_w=$(( (${#pct} * 66) / 10 + 12 ))
          total_w=$((label_w + value_w))
          label_mid=$((label_w * 10 / 2))
          value_mid=$(((label_w * 10) + (value_w * 10 / 2)))

          # Colour thresholds mirror the shields.io convention. Integer shell
          # arithmetic avoids any dependency on locale-sensitive float parsing.
          whole="${pct%%.*}"
          whole="${whole%\%}"
          if [ "$whole" -lt 50 ]; then colour='#e05d44'
          elif [ "$whole" -lt 70 ]; then colour='#dfb317'
          elif [ "$whole" -lt 90 ]; then colour='#97ca00'
          else colour='#4c1'
          fi

          label_text_w=$(( (label_w - 12) * 10 ))
          value_text_w=$(( (value_w - 12) * 10 ))

          # Written with printf rather than a heredoc so the YAML block scalar's
          # indentation cannot leak into the file or break the terminator.
          printf '%s' \
            "<svg xmlns=\"http://www.w3.org/2000/svg\" width=\"${total_w}\" height=\"20\" role=\"img\" aria-label=\"${label}: ${pct}\">" \
            "<title>${label}: ${pct}</title>" \
            "<linearGradient id=\"s\" x2=\"0\" y2=\"100%\"><stop offset=\"0\" stop-color=\"#bbb\" stop-opacity=\".1\"/><stop offset=\"1\" stop-opacity=\".1\"/></linearGradient>" \
            "<clipPath id=\"r\"><rect width=\"${total_w}\" height=\"20\" rx=\"3\" fill=\"#fff\"/></clipPath>" \
            "<g clip-path=\"url(#r)\">" \
            "<rect width=\"${label_w}\" height=\"20\" fill=\"#555\"/>" \
            "<rect x=\"${label_w}\" width=\"${value_w}\" height=\"20\" fill=\"${colour}\"/>" \
            "<rect width=\"${total_w}\" height=\"20\" fill=\"url(#s)\"/>" \
            "</g>" \
            "<g fill=\"#fff\" text-anchor=\"middle\" font-family=\"Verdana,Geneva,DejaVu Sans,sans-serif\" text-rendering=\"geometricPrecision\" font-size=\"110\">" \
            "<text aria-hidden=\"true\" x=\"${label_mid}\" y=\"150\" fill=\"#010101\" fill-opacity=\".3\" transform=\"scale(.1)\" textLength=\"${label_text_w}\">${label}</text>" \
            "<text x=\"${label_mid}\" y=\"140\" transform=\"scale(.1)\" textLength=\"${label_text_w}\">${label}</text>" \
            "<text aria-hidden=\"true\" x=\"${value_mid}\" y=\"150\" fill=\"#010101\" fill-opacity=\".3\" transform=\"scale(.1)\" textLength=\"${value_text_w}\">${pct}</text>" \
            "<text x=\"${value_mid}\" y=\"140\" transform=\"scale(.1)\" textLength=\"${value_text_w}\">${pct}</text>" \
            "</g></svg>" \
            > BadgeOut/coverage.svg

          echo "Generated badge for ${label}: ${pct}"

      - name: Publish badge to the badges branch
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
          GIT_COMMITTER_NAME: github-actions[bot]
          GIT_COMMITTER_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail

          # Stash the generated files outside the work tree before switching
          # branches, so checking out an orphan branch cannot clobber them.
          staging="$(mktemp -d)"
          cp BadgeOut/coverage.svg "$staging/coverage.svg"
          cp BadgeOut/Summary.txt "$staging/coverage-summary.txt"

          git fetch origin badges --depth=1 || true

          if git rev-parse --verify origin/badges >/dev/null 2>&1; then
            git checkout -B badges origin/badges
          else
            # First run: start a clean, history-free branch that holds nothing
            # but the badge assets.
            git checkout --orphan badges
            git rm -rf . >/dev/null 2>&1 || true
          fi

          cp "$staging/coverage.svg" coverage.svg
          cp "$staging/coverage-summary.txt" coverage-summary.txt

          git add coverage.svg coverage-summary.txt

          # Nothing to do when coverage is unchanged; avoids an empty commit on
          # every push to main.
          if git diff --cached --quiet; then
            echo "Coverage badge unchanged."
            exit 0
          fi

          git commit -m "Update coverage badge [skip ci]"
          git push origin badges
